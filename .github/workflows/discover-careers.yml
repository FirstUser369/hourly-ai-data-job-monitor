name: Discover public employer career feeds
on:
  schedule:
    - cron: '41 7 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: career-feed-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Discover public ATS boards from configured career pages
        run: python career_discovery.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: career-discovery-report-${{ github.run_id }}
          path: career_discovery_report.json
          if-no-files-found: ignore
      - name: Save verified discovered feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f discovered_boards.yml
          if ! git diff --cached --quiet; then
            git commit -m "Update discovered public career feeds [skip ci]"
            git pull --rebase
            git push
          fi

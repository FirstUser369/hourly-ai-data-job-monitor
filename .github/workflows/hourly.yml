name: Find AI/Data jobs since my last run
on:
  workflow_dispatch:
    inputs:
      discover_career_pages:
        description: 'Discover AI companies + Fortune 500 (2026) public career feeds before searching'
        type: boolean
        required: false
        default: true
      refresh_perm_history:
        description: 'Refresh official DOL PERM employer history (otherwise use cached index)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: manual-job-search
  cancel-in-progress: false
jobs:
  find-jobs:
    name: Find jobs and build results
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Automated tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tests -v
      - name: Discover more company career feeds (optional)
        id: discover
        continue-on-error: true
        if: inputs.discover_career_pages == true
        run: python career_discovery.py
      - name: Refresh official DOL PERM history when needed
        id: perm
        continue-on-error: true
        if: inputs.refresh_perm_history == true || hashFiles('perm_history_index.json.gz') == ''
        run: python perm_history.py refresh
      - name: Report PERM download problem without blocking jobs
        if: always() && steps.perm.outcome == 'failure'
        run: |
          echo '### PERM history refresh unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'DOL workbook download or parsing failed. Existing cached PERM data (if any) is used; otherwise all PERM values are Unknown.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch jobs and show results in this run
        id: collect
        continue-on-error: true
        run: python on_demand.py
      - name: Downloadable CSV, JSON and scan health
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jobs-since-last-run-${{ github.run_id }}
          path: |
            job_results/
            career_discovery_report.json
            perm_history_index.json.gz
          if-no-files-found: warn
      - name: Save scan history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f jobs.sqlite3 ]; then git add -f jobs.sqlite3; fi
          if [ -f discovered_boards.yml ]; then git add -f discovered_boards.yml; fi
          if [ -f provider_cache/jobicy.json ]; then git add -f provider_cache/jobicy.json; fi
          if [ -f perm_history_index.json.gz ]; then git add -f perm_history_index.json.gz; fi
          if ! git diff --cached --quiet; then
            git commit -m "Save manual job search history [skip ci]"
            git pull --rebase
            git push
          fi
      - name: Report errors after uploading job results
        if: steps.collect.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.discover.outcome == 'failure'
        run: |
          echo 'Scan, discovery or tests failed. Review the available job results artifact and step logs.'
          exit 1

name: Hourly direct ATS job monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ats-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Scan ATS feeds
        id: scan
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python monitor.py
      - name: Upload feed health report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scan-report-${{ github.run_id }}
          path: |
            validation_report.json
            last_run.json
          if-no-files-found: ignore
      - name: Persist database state
        if: always()
        shell: bash
        run: |
          if [ -f jobs.sqlite3 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f jobs.sqlite3
            if ! git diff --cached --quiet; then
              git commit -m "Persist job discovery state [skip ci]"
              git pull --rebase
              git push
            fi
          fi
      - name: Propagate scan failures
        if: steps.scan.outcome == 'failure'
        run: exit 1

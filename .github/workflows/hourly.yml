name: Find AI/Data jobs since my last run
on:
  workflow_dispatch:
    inputs:
      discover_career_pages:
        description: 'Update public employer career feeds before searching'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: manual-job-search
  cancel-in-progress: false
jobs:
  find-jobs:
    name: Find jobs and build results
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Automated tests
        run: python -m unittest discover -s tests -v
      - name: Discover more company career feeds (optional)
        if: inputs.discover_career_pages == true
        run: python career_discovery.py
      - name: Fetch jobs and show results in this run
        id: collect
        continue-on-error: true
        run: python on_demand.py
      - name: Downloadable CSV, JSON and scan health
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jobs-since-last-run-${{ github.run_id }}
          path: |
            job_results/
            career_discovery_report.json
          if-no-files-found: warn
      - name: Save scan history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f jobs.sqlite3 ]; then git add -f jobs.sqlite3; fi
          if [ -f discovered_boards.yml ]; then git add -f discovered_boards.yml; fi
          if [ -f provider_cache/jobicy.json ]; then git add -f provider_cache/jobicy.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Save manual job search history [skip ci]"
            git pull --rebase
            git push
          fi
      - name: Report scan failure
        if: steps.collect.outcome == 'failure'
        run: exit 1

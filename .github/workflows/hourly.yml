name: Hourly AI/Data job monitor + career discovery
on:
  schedule:
    # Scan employers every hour (UTC); GitHub scheduled runs may be delayed.
    - cron: '17 * * * *'
    # Refresh opt-in employer career-page discovery weekly, then scan.
    - cron: '41 7 * * 0'
  workflow_dispatch:
    inputs:
      discover_career_pages:
        description: 'Also discover employer ATS feeds before the job scan'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: unified-job-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Discover public employer career feeds
        id: discover
        if: github.event.schedule == '41 7 * * 0' || inputs.discover_career_pages == true
        continue-on-error: true
        run: python career_discovery.py
      - name: Scan jobs published in last 60 minutes
        id: scan
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python monitor.py
      - name: Upload scan and discovery reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: job-monitor-report-${{ github.run_id }}
          path: |
            validation_report.json
            last_run.json
            career_discovery_report.json
          if-no-files-found: ignore
      - name: Persist job history and validated career feeds
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f jobs.sqlite3 ]; then git add -f jobs.sqlite3; fi
          if [ -f discovered_boards.yml ]; then git add -f discovered_boards.yml; fi
          if ! git diff --cached --quiet; then
            git commit -m "Persist job history and career discoveries [skip ci]"
            git pull --rebase
            git push
          fi
      - name: Fail on scan or discovery failure
        if: steps.scan.outcome == 'failure' || steps.discover.outcome == 'failure'
        run: |
          echo "Inspect earlier scan/discovery steps and uploaded reports."
          exit 1
